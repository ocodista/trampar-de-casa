version: '3.8'

services:
  web-build:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        EMAIL_KEY: ${EMAIL_KEY}
        EMAIL_PASS: ${EMAIL_PASS}
        CRYPT_SECRET: ${CRYPT_SECRET}
        RESEND_KEY: ${RESEND_KEY}
        RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
        OWNER_EMAIL: ${OWNER_EMAIL}
        NEXT_PUBLIC_MIXPANEL_KEY: ${NEXT_PUBLIC_MIXPANEL_KEY:-}
        CRON_SECRET: ${CRON_SECRET}
        POSTGRES_URL: ${POSTGRES_URL}
        REDIS_URL: ${REDIS_URL}
    image: ${DOCKER_REGISTRY_HOST}/trampar-de-casa:latest
    env_file:
      - scripts/.secrets
    profiles:
      - build

  auto-email-sender-build:
    build:
      context: .
      dockerfile: Dockerfile.auto
      platforms:
        - linux/amd64
      args:
        SECRET_KEY: ${SECRET_KEY}
        RESEND_KEY: ${RESEND_KEY}
        POSTGRES_URL: ${POSTGRES_URL}
        MONGO_ADDRESS: ${MONGO_ADDRESS}
        MONGO_PASSWORD: ${MONGO_PASSWORD}
        MONGO_USERNAME: ${MONGO_USERNAME}
        RABBITMQ_ADDRESS: ${RABBITMQ_ADDRESS}
    image: ${DOCKER_REGISTRY_HOST}/auto-email-sender:latest
    env_file:
      - scripts/.secrets
    profiles:
      - build

  match-roles-build:
    build:
      context: ./apps/auto-email-sender/src/match_roles
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        POSTGRES_URL: ${POSTGRES_URL}
    image: ${DOCKER_REGISTRY_HOST}/match-roles:latest
    env_file:
      - scripts/.secrets
    profiles:
      - build